[project]
name = "grocery-wizard"
version = "0.0.0"
description = "Notion-driven meal planning and grocery lists"
requires-python = ">=3.12,<3.13"

dependencies = [
    "beautifulsoup4>=4.12.3",
    "certifi>=2026.10.19",
    "ingredient-parser-nlp>=2.7.0",
    "loguru>=0.7.2",
    "notion-client>=2.2.1",
    "pillow-heif>=0.18.0",
    "pydantic-settings>=2.7.0",
    "PyMuPDF>=1.24.0,<2",
    "pytesseract>=0.3.13",
    "python-dotenv>=1.0.1",
    "requests>=2.32.3",
    "streamlit[auth]>=1.42.0",
]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.2.2",
    "ruff>=0.15.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Cursor slash-command symlinks under `.cursor/commands/` point into `.cursor/rg-ai/`
# (git submodule). CI checks out without submodules, so broken symlink targets make
# `ruff format --check` fail with ENOENT. Commands are Markdown, not Python.
extend-exclude = [".cursor", "docs/poc"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "N",    # PEP 8 naming
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
    "C4",   # flake8-comprehensions
    "PIE",  # flake8-pie
    "RET",  # flake8-return
    "ISC",  # flake8-implicit-str-concat
    "PGH",  # pygrep-hooks
    "DTZ",  # flake8-datetimez
    "PERF", # perflint
    "FLY",  # flynt (f-string conversions)
    "PT",   # flake8-pytest-style
    "PLR",  # pylint refactor
    "PLE",  # pylint errors
    "PLW",  # pylint warnings
    "TRY",  # tryceratops
    "EM",   # flake8-errmsg
    "FURB", # refurb (modernise patterns)
    "ANN",  # flake8-annotations
    "PTH",  # use pathlib over os.path (repo is pathlib-native)
    "LOG",  # logging: no redundant exc_info / implicit root
    "ICN",  # unconventional import aliases (import pandas as pd)
    "TID",  # tidy import restrictions (relative vs absolute)
    "BLE",  # no blind except Exception — use NOTION_BOUNDARY_ERRORS or explicit types
    "COM",  # trailing commas (COM812)
    "TC",   # type-checking-only imports (TCH)
    "INP",  # implicit namespace packages (tests dirs use __init__.py)
    "SLF",  # private member access (tests; narrow src exceptions in per-file-ignores)
]
ignore = [
    "EM101",
    "EM102",
    "TRY003",
    "PLR2004",
    "PLR0912",
    "PLR0913",
    "PLR0915",
    "PLR0911",
    "SIM108",
    "ANN401",
    "COM812",  # conflicts with ruff format; formatter owns trailing commas
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["E501", "PLR2004", "ANN", "SLF001"]
"src/grocery_wizard/ui/weekly_plan_add.py" = ["SLF001"]
"src/grocery_wizard/ui/notion_cache.py" = ["SLF001"]
"src/grocery_wizard/ui/grocery_flow.py" = ["SLF001"]
"src/grocery_wizard/ui/meal_plan_status_ui.py" = ["SLF001"]
"src/grocery_wizard/dev/perf_audit/tap.py" = ["SLF001"]
"src/grocery_wizard/integrations/notion/views.py" = ["SLF001"]
"src/grocery_wizard/recipes/recipe_meal_plan_stats.py" = ["SLF001"]
"src/grocery_wizard/ui/app.py" = ["E402"]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true
mypy-init-return = true
suppress-dummy-args = true
suppress-none-returning = true

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "golden_grocery: full weekly grocery export snapshots (just golden-grocery)",
    "holistic_ui_smoke: headless AppTest smoke for app load and primary pages (just smoke-ui)",
]
