[theme]
base = "light"
primaryColor = "#8b1a5c"
backgroundColor = "#ffe4f0"
secondaryBackgroundColor = "#fff9fc"
textColor = "#5c1040"

[browser]
gatherUsageStats = false

# Custom in-app navigation (segmented control); ignore auto `pages/` sidebar.
[client]
showSidebarNavigation = false

# Community Cloud shares one inotify limit per host; the watchdog watcher
# exhausts it ("inotify instance limit reached"). Deployed apps need no hot reload.
[server]
fileWatcherType = "none"
